name: Deploy Laguna

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_tests:
        description: Rodar testes específicos do módulo (tests/run.php + Feature)
        type: boolean
        default: true
      run_migrate:
        description: Rodar migrate --path das migrations deste pacote
        type: boolean
        default: true

concurrency:
  group: deploy-laguna-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    uses: i-Educar/i-educar-laguna-ambiente-package/.github/workflows/reusable-deploy-laguna.yml@main
    with:
      package_repo: ${{ github.event.repository.name }}
      # Em push: sempre testes + migrate do pacote. Em dispatch: segue os inputs (default true).
      run_tests: ${{ github.event_name == 'push' || github.event.inputs.run_tests == 'true' }}
      run_migrate: ${{ github.event_name == 'push' || github.event.inputs.run_migrate == 'true' }}
    secrets:
      LAGUNA_SSH_HOST: ${{ secrets.LAGUNA_SSH_HOST }}
      LAGUNA_SSH_USER: ${{ secrets.LAGUNA_SSH_USER }}
      LAGUNA_SSH_KEY: ${{ secrets.LAGUNA_SSH_KEY }}
      LAGUNA_APP_PATH: ${{ secrets.LAGUNA_APP_PATH }}
